name: 🐛 Bug
description: 🚨 Registrar un error o comportamiento inesperado
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 🎯 ¿Qué pasó?
      description: Describe el error en una línea.
      placeholder: "Ej: Al enviar el formulario muestra error 500."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔁 Cómo reproducirlo
      description: Pasos detallados para reproducir el bug.
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Ver el error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Qué esperaba que pasara
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ Qué pasó realmente
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 📎 Notas / capturas
      description: Opcional. Screenshots, logs, ideas de solución.
    validations:
      required: false
